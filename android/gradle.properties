# Alokasi memori yang sudah dimodifikasi untuk kecepatan maksimum
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# Fitur wajib untuk mempercepat kompilasi Gradle di Flutter baru
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

