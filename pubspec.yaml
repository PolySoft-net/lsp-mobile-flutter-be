name: lsp_digital_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.1-build.185+209
environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_lucide: ^1.47.0
  januscaler_flutter_ringtone_player: ^1.0.2
  flutter_secure_storage: ^11.2.0
  intl: 0.20.3
  syncfusion_flutter_maps: ^34.2.8
  file_picker: ^13.1.0
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.2
  in_app_update_flutter: ^3.0.0
  qr_flutter: ^4.1.0

  material_ui: ^1.3.0
  google_maps_flutter: ^2.18.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  geocode_cache: ^1.1.0
  google_places_sdk_plus: ^1.1.0
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
